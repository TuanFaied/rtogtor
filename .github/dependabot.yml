version: 2
updates:
  - package-ecosystem: gomod
    directory: /engine
    schedule:
      interval: weekly
    ignore:
      # v0.42.0+ requires Go 1.26; the engine supports Go 1.25 (see
      # docs/dependencies.md). Remove when the minimum Go version is raised.
      - dependency-name: golang.org/x/text
        versions: [">= 0.42.0"]
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /sdks/dotnet
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /tools/codegen
    schedule:
      interval: monthly

  - package-ecosystem: pip
    directory: /sdks/python
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /sdks/typescript
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint supports TypeScript < 6.1; raise together.
      - dependency-name: typescript
        versions: [">= 6.1.0"]
    groups:
      npm:
        patterns: ["*"]
