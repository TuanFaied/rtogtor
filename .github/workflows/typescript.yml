name: typescript

on:
  push:
    branches: [main]
    paths: &paths
      - "sdks/typescript/**"
      - "engine/**"
      - "specs/**"
      - "conformance/**"
      - "examples/**"
      - ".github/workflows/typescript.yml"
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: typescript-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sdks/typescript
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22"]
        include:
          - { os: ubuntu-latest, node: "24" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: engine/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: npm ci
      - name: Build the engine for this platform
        run: npm run build:engine
      - name: Type check (strict)
        run: npm run typecheck
      - name: ESLint and Prettier
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Tests (offline, engine, protocol, conformance, properties)
        env:
          RTOGTOR_CONFORMANCE_OUT: ${{ runner.temp }}/conformance-typescript-${{ runner.os }}-${{ matrix.node }}.json
        run: npm test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-typescript-${{ runner.os }}-${{ matrix.node }}
          path: ${{ runner.temp }}/conformance-typescript-${{ runner.os }}-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 30

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rtogtor
          # Throwaway passwords for containers that live only for this job.
          POSTGRES_PASSWORD: rtogtor-ci
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rtogtor -d ecommerce"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/rtogtor-ci-password
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p rtogtor-ci-password 'RETURN 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 40
          --health-start-period 20s
    env:
      RTOGTOR_TEST_POSTGRES_URL: postgres://rtogtor:rtogtor-ci@localhost:5432/ecommerce?sslmode=disable
      RTOGTOR_TEST_NEO4J_URL: neo4j://neo4j:rtogtor-ci-password@localhost:7687
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: engine/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - name: Load the e-commerce example
        env:
          PGPASSWORD: rtogtor-ci
        run: psql -h localhost -U rtogtor -d ecommerce -v ON_ERROR_STOP=1 -f ../../examples/ecommerce/schema.sql
      - run: npm ci
      - run: npm run build:engine
      - name: Integration tests
        run: npx vitest run tests/integration.test.ts

  pack:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: engine/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: npm ci
      - name: Pack @rtogtor/sdk and the five platform packages
        run: node scripts/pack.mjs
      - name: Check the packages
        run: |
          ls -l ../../dist/npm
          test "$(ls ../../dist/npm/*.tgz | wc -l)" -eq 6
          tar -tvzf ../../dist/npm/rtogtor-sdk-linux-x64-*.tgz | grep -E "^-rwxr-xr-x .* package/bin/rtogtor$" \
            || { echo "::error::linux engine missing or not executable"; exit 1; }
      - name: Smoke test the installed packages (bundled engine)
        run: node scripts/smoke.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: dist/npm/*.tgz
          retention-days: 14
